<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Hàng Tủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
	<!-- Thư viện Viewer.js để xem ảnh mượt mà như Zalo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
	
    <!-- Supabase, SweetAlert2 & HTML5-QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --bg-body: #F3F4F6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-sub: #6B7280;
            --border: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-size: 28px; font-weight: 700; color: #1F2937; margin: 0; }
        
        .admin-btn {
            background: white; border: 1px solid var(--border); color: var(--text-main);
            padding: 10px 16px; border-radius: 30px; text-decoration: none;
            font-weight: 600; font-size: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 6px;
        }

        /* --- VÙNG TÌM KIẾM & QUÉT MÃ --- */
        .search-container {
            display: flex; gap: 10px; max-width: 500px; margin: 0 auto 40px auto;
        }
        .search-wrapper { position: relative; flex: 1; }
        .search-box {
            width: 100%; padding: 14px 20px 14px 45px; border: 1px solid var(--border); border-radius: 50px;
            background: white; font-size: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); outline: none; box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #9CA3AF; }
        .btn-scan {
            background: var(--text-main); color: white; border: none;
            border-radius: 50%; width: 50px; height: 50px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; flex-shrink: 0; padding: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-scan:hover { background: #374151; transform: translateY(-2px); }
        .btn-scan svg { width: 22px; height: 22px; }

        /* PC Table */
        .table-card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #FAFAFA; position: sticky; top: 0; z-index: 10; text-align: left; padding: 14px 20px; font-size: 12px; text-transform: uppercase; color: var(--text-sub); font-weight: 600; border-bottom: 1px solid var(--border); }
        tbody tr { border-bottom: 1px solid var(--border); }
        tbody td { padding: 14px 20px; vertical-align: middle; }
        .group-row { background-color: #F9FAFB; cursor: pointer; font-weight: 600; color: #374151; }
        
        .clickable-img { cursor: pointer; transition: transform 0.2s; }
        .clickable-img:hover { transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .product-img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }

        /* Badges */
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .bg-green { background: #ECFDF5; color: #059669; }
        .bg-yellow { background: #FFFBEB; color: #D97706; }
        .bg-red { background: #FEF2F2; color: #DC2626; }
        .bg-gray { background: #F3F4F6; color: #4B5563; border: 1px solid #E5E7EB; }

        /* Buttons & Controls */
        .btn-buy { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.2s; min-width: 100px;}
        .btn-buy:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-buy:disabled { background: #9CA3AF; cursor: not-allowed; opacity: 0.7; }
        .qty-wrapper { display: flex; align-items: center; border: 1px solid #D1D5DB; border-radius: 6px; overflow: hidden; background: white; }
        .qty-wrapper button { background: white; border: none; padding: 6px 12px; cursor: pointer; font-size: 15px; font-weight: bold; color: #374151; }
        .qty-input { width: 35px; text-align: center; border: none; font-weight: 600; outline: none; }

        /* Modal Chung (Cho Ảnh và Camera) */
        .custom-modal {
            display: none; position: fixed; z-index: 9999; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.85);
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .custom-modal img {
            max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: zoomIn 0.2s ease-out;
        }
        .close-modal {
            position: absolute; top: 20px; right: 30px; color: white;
            font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; z-index: 10000;
        }
        .close-modal:hover { color: #d1d5db; transform: scale(1.1); }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Khung quét mã vạch */
        .scanner-box {
            background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px;
            text-align: center; animation: zoomIn 0.2s ease-out;
        }

        /* Empty State */
        .empty-state { text-align: center; padding: 50px 20px; color: #6B7280; font-size: 16px; font-weight: 500; }

        /* Mobile View */
        .mobile-view { display: none; }
        
		/* Đồng bộ góc bo tròn cho các nút của SweetAlert2 (Popup) */
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm, 
        div:where(.swal2-container) button:where(.swal2-styled).swal2-cancel {
            border-radius: 30px !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 500 !important;
            padding: 8px 24px !important;
        }
		
        @media (max-width: 768px) {
            .table-card { display: none; }
            .mobile-view { display: flex; flex-direction: column; gap: 14px; }
            .main-wrapper { padding: 16px; }
            h1 { font-size: 22px; }
            header { margin-bottom: 20px; }
            .search-container { margin-bottom: 20px; }
            
            .m-card { background: white; border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; }
            .m-body { padding: 12px; display: flex; gap: 12px; align-items: center; }
            .m-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #f9f9f9; border: 1px solid #eee; }
            .m-info { flex: 1; min-width: 0; }
            .m-title { font-weight: 600; color: #111827; font-size: 15px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .m-meta { display: flex; flex-wrap: wrap; gap: 6px; }
            .m-barcode { font-size: 12px; color: #6B7280; font-family: monospace; background: #F3F4F6; padding: 2px 6px; border-radius: 4px; }
            
            .m-footer { background: #F9FAFB; padding: 10px 12px; border-top: 1px solid #F3F4F6; display: flex; justify-content: space-between; align-items: center; }
            .m-stock-status { font-size: 13px; font-weight: 600; }
            .m-actions { display: flex; gap: 8px; align-items: center; }
            .m-qty-wrap { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; background: white; height: 34px; }
            .m-qty-btn { width: 28px; height: 100%; border: none; background: transparent; font-weight: bold; font-size: 15px; color: #555; }
            .m-qty-inp { width: 28px; text-align: center; border: none; font-weight: 600; font-size: 13px; }
            .m-btn-buy { background: var(--primary); color: white; border: none; height: 34px; padding: 0 14px; border-radius: 20px; font-weight: 600; font-size: 13px; min-width: 80px;}
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <h1>📦 Kho Hàng</h1>
            <a href="admin.html" class="admin-btn">🔐 Admin</a>
        </header>

        <div class="search-container">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input id="searchInput" class="search-box" type="text" placeholder="Tìm tên, mã vạch, loại..." oninput="debounceSearch(this.value)">
            </div>
            
            <!-- Nút quét mã bằng Icon SVG -->
            <button class="btn-scan" onclick="openScanner()" title="Quét mã vạch">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    <path d="M8 7v10"></path>
                    <path d="M12 7v10"></path>
                    <path d="M16 7v10"></path>
                </svg>
            </button>
        </div>

        <div id="pc-table" class="table-card"></div>
        <div id="mobile-list" class="mobile-view"></div>
    </div>

    <!-- Ảnh gốc ẩn dành riêng cho Viewer.js -->
    <img id="hidden-image-viewer" style="display: none;" src="">

    <!-- Modal Quét Mã Vạch -->
    <div id="scannerModal" class="custom-modal">
        <span class="close-modal" onclick="closeScanner()">&times;</span>
        <div class="scanner-box" onclick="event.stopPropagation()">
            <h3 style="margin-top:0; color:#1f2937">Quét Mã Vạch / QR</h3>
            <div id="reader" style="width:100%"></div>
        </div>
    </div>

    <script>
        // Cấu hình Database
        const SUPABASE_URL = 'https://gpmuckoydhrokpioltem.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwbXVja295ZGhyb2twaW9sdGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU3MTMzNTcsImV4cCI6MjA4MTI4OTM1N30.Fqe5U2hm_fERI6ZLc_FQ1SMh5F4sYOrxr8JqLlwLKI0';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function isMobile() { return window.innerWidth <= 768; }

        async function loadInventory() {
            const container = isMobile() ? document.getElementById("mobile-list") : document.getElementById("pc-table");
            container.innerHTML = '<div class="empty-state">⏳ Đang tải dữ liệu...</div>';

            try {
                let { data, error } = await db.from('inventory').select('*');
                if (error) throw error;
                window.inventoryData = (data || []).map(i => ({ ...i, TonKho: parseInt(i.ton_kho || 0) }));
                renderApp(window.inventoryData);
            } catch (err) {
                container.innerHTML = `<div class="empty-state" style="color:red">❌ ${err.message}</div>`;
            }
        }

        function renderApp(data) {
            renderPC(data);
            renderMobile(data);
        }

        function renderPC(data) {
            const container = document.getElementById("pc-table");
            if (data.length === 0) {
                container.innerHTML = '<div class="empty-state">📦 Không tìm thấy sản phẩm nào</div>';
                return;
            }

            let grouped = {};
            data.forEach(item => {
                if (item.TonKho <= 0) return;
                let key = item.loai_tu || "Khác";
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = '<div class="empty-state">📦 Kho trống hoặc đã hết hàng</div>';
                return;
            }

            let html = `<table><thead><tr><th width="30%">Tên mẫu & Loại</th><th width="15%">Barcode</th><th width="15%">Tồn kho</th><th width="15%">Hình ảnh</th><th width="25%">Thao tác</th></tr></thead><tbody>`;

            Object.keys(grouped).forEach((loai, idx) => {
                let items = grouped[loai];
                let total = items.reduce((s, i) => s + i.TonKho, 0);
                let groupId = `g_${idx}`;
                
                html += `<tr class="group-row" onclick="toggleGroup('${groupId}')"><td colspan="5">▶ ${loai} <span style="font-weight:400; color:#6B7280">(${total})</span></td></tr>`;

                items.forEach((item, i) => {
                    let rowKey = `pc_${idx}_${i}`;
                    // Áp dụng loading="lazy"
                    let imgTag = item.hinh ? `<img src="images/${item.hinh}" loading="lazy" class="product-img clickable-img" onerror="this.style.display='none'" onclick="viewImage('images/${item.hinh}', event)">` : '-';
                    
                    html += `
                        <tr class="child-row" data-group="${groupId}" style="display:none">
                            <td style="padding-left:30px">
                                <div style="font-weight:600">${item.ten_mau || ''}</div>
                                <div style="font-size:13px; color:#6B7280">${item.loai_tu || ''}</div>
                            </td>
                            <td style="font-family:monospace">${item.barcode || ''}</td>
                            <td>${getStockBadge(item.TonKho, rowKey)}</td>
                            <td>${imgTag}</td>
                            <td>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <div class="qty-wrapper">
                                        <button onclick="upVal('${rowKey}', -1, ${item.TonKho})">-</button>
                                        <input id="qty_${rowKey}" class="qty-input" value="1" readonly>
                                        <button onclick="upVal('${rowKey}', 1, ${item.TonKho})">+</button>
                                    </div>
                                    <button id="btn_${rowKey}" class="btn-buy" onclick="buyItem('${encodeURIComponent(item.barcode || '')}', '${encodeURIComponent(item.hinh || '')}', '${rowKey}')">Xuất hàng</button>
                                </div>
                            </td>
                        </tr>`;
                });
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderMobile(data) {
            const container = document.getElementById("mobile-list");
            let html = '';
            
            let hasItem = false;
            data.forEach((item, idx) => {
                if (item.TonKho <= 0) return;
                hasItem = true;
                let key = `m_${idx}`;
                let stockColor = item.TonKho > 10 ? '#059669' : (item.TonKho > 3 ? '#D97706' : '#DC2626');
                
                let imgTag = item.hinh ? `<img src="images/${item.hinh}" loading="lazy" class="m-img clickable-img" onerror="this.style.display='none'" onclick="viewImage('images/${item.hinh}', event)">` : '<div class="m-img"></div>';
                
                html += `
                    <div class="m-card" id="card_${key}">
                        <div class="m-body">
                            ${imgTag}
                            <div class="m-info">
                                <div class="m-title">${item.ten_mau || ''}</div>
                                <div class="m-meta">
                                    <span class="badge bg-gray">${item.loai_tu || 'Khác'}</span>
                                    <span class="m-barcode">${item.barcode || ''}</span>
                                </div>
                            </div>
                        </div>
                        <div class="m-footer">
                            <div class="m-stock-status" style="color:${stockColor}">
                                <span id="mtxt_${key}">Tồn kho: ${item.TonKho}</span>
                            </div>
                            <div class="m-actions">
                                <div class="m-qty-wrap">
                                    <button class="m-qty-btn" onclick="upVal('${key}', -1, ${item.TonKho})">-</button>
                                    <input id="qty_${key}" class="m-qty-inp" type="number" value="1" readonly>
                                    <button class="m-qty-btn" onclick="upVal('${key}', 1, ${item.TonKho})">+</button>
                                </div>
                                <button id="btn_${key}" class="m-btn-buy" onclick="buyItem('${encodeURIComponent(item.barcode || '')}', '${encodeURIComponent(item.hinh || '')}', '${key}')">Xuất</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if (!hasItem) {
                container.innerHTML = '<div class="empty-state m-card" style="background:white">📦 Không tìm thấy sản phẩm nào</div>';
            } else {
                container.innerHTML = html;
            }
        }

        // --- DEBOUNCE TÌM KIẾM ---
        let searchTimeout;
        function debounceSearch(k) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                k = k.toLowerCase().trim();
                const filtered = (window.inventoryData || []).filter(i => 
                    `${i.ten_mau || ''} ${i.barcode || ''} ${i.loai_tu || ''}`.toLowerCase().includes(k)
                );
                renderApp(filtered);
                if(k && !isMobile()) {
                    setTimeout(() => document.querySelectorAll('.child-row').forEach(r => r.style.display = 'table-row'), 50);
                }
            }, 300);
        }

        // --- XỬ LÝ ẢNH CHUNG (CĂN GIỮA CHUẨN MƯỢT) ---
        let imageViewer = null;
        let defaultRatio = 0;
        let defaultX = 0;
        let defaultY = 0;
        let isClosing = false;

        // Hàm bắt sự kiện nhả ngón tay
        function snapToCenter(e) {
            if (isClosing || !imageViewer || !imageViewer.imageData) return;

            // TUYỆT CHIÊU: Chỉ giật ảnh về giữa NẾU ngón tay vừa chạm vào bức ảnh.
            // Nếu chạm vào nút X hoặc phông nền -> KHÔNG giật, nhường đường cho lệnh Tắt ảnh.
            if (e && e.target && e.target.tagName.toLowerCase() !== 'img') {
                return;
            }

            // Kiểm tra nếu ảnh đang ở kích thước bình thường
            if (imageViewer.imageData.ratio <= defaultRatio + 0.01) {
                let currentX = imageViewer.imageData.x;
                let currentY = imageViewer.imageData.y;
                
                // Trượt mượt mà về lại tọa độ trung tâm gốc
                if (Math.abs(currentX - defaultX) > 1 || Math.abs(currentY - defaultY) > 1) {
                    imageViewer.moveTo(defaultX, defaultY);
                }
            }
        }

        function viewImage(src, event) {
            if (event) event.stopPropagation();
            
            const imgEl = document.getElementById("hidden-image-viewer");
            imgEl.src = src;

            if (imageViewer) {
                imageViewer.destroy();
            }

            isClosing = false;

            imageViewer = new Viewer(imgEl, {
                toolbar: false,       
                navbar: false,        
                title: false,         
                button: true,         
                backdrop: true,       
                transition: true,     
                zoomRatio: 0.3,
                
                viewed: function () {
                    // 1. Chặn thu nhỏ an toàn (Khắc phục hoàn toàn lỗi nút X)
                    imageViewer.options.minZoomRatio = imageViewer.imageData.ratio;
                    
                    // 2. Ghi nhớ tọa độ
                    defaultRatio = imageViewer.imageData.ratio;
                    defaultX = imageViewer.imageData.x;
                    defaultY = imageViewer.imageData.y;

                    // 3. Lắng nghe lúc nhả tay để tự động bật về giữa
                    imageViewer.viewer.addEventListener('touchend', snapToCenter);
                    imageViewer.viewer.addEventListener('mouseup', snapToCenter);
                },
                
                hide: function () {
                    isClosing = true; // Bật cờ khóa giật ảnh
                },
                
                hidden: function () {
                    if (imageViewer && imageViewer.viewer) {
                        imageViewer.viewer.removeEventListener('touchend', snapToCenter);
                        imageViewer.viewer.removeEventListener('mouseup', snapToCenter);
                    }
                    imageViewer.destroy(); 
                    imageViewer = null;
                }
            });
            
            imageViewer.show();
        }

        // --- XỬ LÝ QUÉT MÃ VẠCH CAMERA (TỰ ĐỘNG MỞ) ---
        let html5Qrcode;
        
        function openScanner() {
            // Hiện Modal lên trước
            document.getElementById("scannerModal").style.display = "flex";
            
            if (!html5Qrcode) {
                html5Qrcode = new Html5Qrcode("reader");
            }

            // Gọi lệnh ép mở camera sau (environment) ngay lập tức
            html5Qrcode.start(
                { facingMode: "environment" }, 
                {
                    fps: 10, 
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                onScanFailure
            ).catch((err) => {
                // Xử lý khi người dùng từ chối quyền camera hoặc lỗi thiết bị
                document.getElementById("scannerModal").style.display = "none";
                Swal.fire('Lỗi Camera', 'Vui lòng cấp quyền sử dụng camera cho trình duyệt!', 'error');
            });
        }

        function closeScanner() {
            if (html5Qrcode && html5Qrcode.isScanning) {
                // Phải stop camera trước khi đóng để tắt đèn xanh của webcam/camera
                html5Qrcode.stop().then(() => {
                    document.getElementById("scannerModal").style.display = "none";
                }).catch((err) => {
                    document.getElementById("scannerModal").style.display = "none";
                });
            } else {
                document.getElementById("scannerModal").style.display = "none";
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Đóng camera khi quét thành công
            closeScanner();
            
            // Gắn vào ô tìm kiếm và gọi hàm lọc
            let searchInput = document.getElementById("searchInput");
            searchInput.value = decodedText;
            debounceSearch(decodedText);
            
            // Thông báo ngắn gọn
            Swal.fire({
                title: 'Đã quét!',
                text: `Mã: ${decodedText}`,
                icon: 'success',
                timer: 1500,
                showConfirmButton: false,
                toast: true,
                position: 'top-end'
            });
        }

        function onScanFailure(error) {
            // Dò liên tục, không cần làm gì khi chưa quét được mã
        }

        // --- XỬ LÝ NGHIỆP VỤ ---
        function getStockBadge(qty, id) {
            let cls = qty > 10 ? 'bg-green' : (qty > 3 ? 'bg-yellow' : 'bg-red');
            let txt = qty > 10 ? 'Sẵn hàng' : 'Sắp hết';
            return `<span id="badge_${id}" class="badge ${cls}">${qty} • ${txt}</span>`;
        }

        function upVal(id, delta, maxStock) {
            let el = document.getElementById(`qty_${id}`);
            let val = parseInt(el.value || 1) + delta;
            if (val >= 1 && (!maxStock || val <= maxStock)) {
                el.value = val;
            }
        }

        function toggleGroup(id) {
            let rows = document.querySelectorAll(`tr[data-group="${id}"]`);
            rows.forEach(r => r.style.display = r.style.display === 'none' ? 'table-row' : 'none');
        }

        async function buyItem(encodedBarcode, encodedHinh, uiId) {
            const barcode = decodeURIComponent(encodedBarcode);
            const hinh = decodeURIComponent(encodedHinh);
            const qty = parseInt(document.getElementById(`qty_${uiId}`).value);
            const btn = document.getElementById(`btn_${uiId}`);

            // Xác nhận bằng SweetAlert thay vì confirm()
            const result = await Swal.fire({
                title: 'Xác nhận xuất kho',
                text: `Số lượng: ${qty} sản phẩm (Mã: ${barcode || 'Không mã'})`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4F46E5',
                cancelButtonColor: '#9CA3AF',
                confirmButtonText: 'Xuất hàng',
                cancelButtonText: 'Hủy bỏ'
            });

            if (!result.isConfirmed) return;

            // Khóa nút để tránh spam click
            if (btn) {
                btn.disabled = true;
                btn.innerText = "⏳ Đang xử lý...";
            }

            try {
                const { data, error } = await db.rpc('reduce_stock', {
                    p_barcode: String(barcode).trim(),
                    p_hinh: String(hinh).trim(),
                    p_qty: qty
                });

                if (error || !data?.success) throw new Error(data?.message || error?.message || 'Có lỗi xảy ra');

                Swal.fire({
                    title: 'Thành công!',
                    text: `Tồn kho mới: ${data.newStock}`,
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                });
                
                // Cập nhật lại UI trực tiếp
                let item = window.inventoryData.find(i => i.barcode === barcode && (i.hinh || '') === hinh);
                if (item) item.TonKho = data.newStock;

                if (data.newStock <= 0) {
                    loadInventory(); // Reload lại nếu hết hàng để ẩn món đó đi
                } else {
                    if (isMobile()) {
                        let txt = document.getElementById(`mtxt_${uiId}`);
                        if (txt) txt.innerText = "Tồn kho: " + data.newStock;
                        // Reset input về 1
                        document.getElementById(`qty_${uiId}`).value = 1;
                    } else {
                        let badge = document.getElementById(`badge_${uiId}`);
                        if (badge) badge.outerHTML = getStockBadge(data.newStock, uiId);
                        document.getElementById(`qty_${uiId}`).value = 1;
                    }
                }
            } catch (err) { 
                Swal.fire('Lỗi xuất kho', err.message, 'error');
            } finally {
                // Mở khóa nút
                if (btn && btn.disabled) {
                    btn.disabled = false;
                    btn.innerText = isMobile() ? "Xuất" : "Xuất hàng";
                }
            }
        }

        // Khởi chạy khi vào trang
        loadInventory();
    </script>
</body>
</html>
